plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.1'
}

group = 'com.github.zh00k'
version = '1.0-SNAPSHOT'

def allureVersion = "2.32.0"

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.codeborne:selenide:7.18.2'
    testImplementation 'net.datafaker:datafaker:2.7.0'
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation 'org.aeonbits.owner:owner:1.0.12'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('positiveTests', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform { includeTags 'positive' }
}

tasks.register('negativeTests', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform { includeTags 'negative' }
}

tasks.register('uiTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        def tag = System.getProperty("tag")

        if (tag != null && !tag.isBlank()) {
            includeTags("UI & ${tag}")
        } else {
            includeTags("UI")
        }
    }

    systemProperties(System.getProperties())
}

tasks.register('apiTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        def tag = System.getProperty("tag")

        if (tag != null && !tag.isBlank()) {
            includeTags("API & ${tag}")
        } else {
            includeTags("API")
        }
    }

    systemProperties(System.getProperties())
}

def cleanAllureResults = tasks.register('cleanAllureResults', Delete) {
    delete layout.buildDirectory.dir('allure-results')
}

tasks.withType(Test).configureEach {
    systemProperty 'run', System.getProperty('run', 'local')
    systemProperty 'selenoidUser', System.getProperty('selenoidUser')
    systemProperty 'selenoidPassword', System.getProperty('selenoidPassword')
    dependsOn cleanAllureResults

    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
    }
}

def cleanCopyCategories = tasks.register('cleanCopyCategories', Delete) {
    delete layout.buildDirectory.dir('copy-categories')
}

tasks.named('copyCategories') {
    dependsOn cleanCopyCategories
    mustRunAfter cleanAllureResults
}

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        aspectjVersion.set("1.9.25.1")
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}
